name: Test and publish Docker image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test release notes
        run: node --test tests/test_release_notes.cjs

      - name: Update release commit notes
        uses: actions/github-script@v7
        with:
          script: |
            const updateReleaseNotes = require('./.github/scripts/release-notes.cjs');
            await updateReleaseNotes({ github, context });

  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install -e '.[test]'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: node --check timesgate/static/app.js

      - name: Test profile editing and saving
        run: node --test tests/test_profiles_ui.cjs

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jaimefordham/timesgate-web
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate media image tags and labels
        id: media-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jaimefordham/timesgate-web-media
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}

      - name: Build and publish media image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/media.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.media-meta.outputs.tags }}
          labels: ${{ steps.media-meta.outputs.labels }}
