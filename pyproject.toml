[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "timesgate-web"
version = "0.1.0"
description = "Web-only Times Gate controller with scheduled HTTP media and Strava stats"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "Pillow>=11,<13",
    "requests>=2.32,<3",
    "filelock>=3.16,<4",
    "tzdata>=2025.1",
    "defusedxml>=0.7,<1",
    "psutil>=7,<8",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["timesgate*"]

[tool.setuptools.package-data]
timesgate = ["static/*"]
